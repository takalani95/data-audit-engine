services:
  - type: web
    name: mash-labs-data-audit-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      - key: BETA_API_TOKEN
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false